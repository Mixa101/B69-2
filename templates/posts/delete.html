{% extends "base.html" %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h4 class="card-title text-danger">
          <i class="bi bi-exclamation-triangle"></i> Удалить пост?
        </h4>
        <p class="mb-1">Вы собираетесь удалить пост:</p>
        <p class="fw-bold">{{ post.title }}</p>
        <p class="text-muted small">Это действие нельзя отменить.</p>

        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i> Да, удалить
          </button>
          <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
